name: Demo Security Gate

on:
  pull_request:
  push:

jobs:
  policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Demo policy check
        run: |
          echo "Starting CognitivTrust security policy checks..."
          
          # Run security scanning tools
          echo "Running dependency vulnerability scan..."
          if ! npm audit --audit-level=high 2>/dev/null && ! pip-audit 2>/dev/null && ! bundle audit 2>/dev/null; then
            echo "No package managers found or vulnerability scan passed"
          fi
          
          echo "Running secret detection..."
          if command -v git >/dev/null 2>&1; then
            if git log --oneline -n 50 | grep -iE '(password|secret|key|token)' && echo "Potential secrets detected in commit messages"; then
              exit 1
            fi
          fi
          
          echo "Running basic SAST checks..."
          find . -name '*.js' -o -name '*.py' -o -name '*.rb' | head -100 | xargs grep -l "eval\|exec\|system" | head -5 && echo "Potentially unsafe code patterns found" && exit 1 || true
          
          echo "CognitivTrust security policy checks completed successfully"
