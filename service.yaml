# Demo service config
company: ClosingDesk Inc.
industry: fintech
service: borrower-portal-api
risk_controls:
  - change approval
  - audit trail
  - secure code review
cors_policy:
  allowed_origins:
    - "https://borrower-portal.closingdesk.com"
  allow_credentials: true
  allowed_methods:
    - GET
   - POST
    - PUT
    - DELETE
  allowed_headers:
    - "Content-Type"
    - "Authorization"
    - "X-Requested-With"
  max_age: 3600
